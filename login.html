<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Login – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>
<div class="app-wrapper">
  <div class="card" style="max-width:400px; margin:40px auto;">
    <h2 style="text-align:center;"><i class="fa-solid fa-key"></i> Login</h2>
    <div><input type="email" id="loginEmail" placeholder="Email" class="input-field"></div>
    <div><input type="password" id="loginPassword" placeholder="Password" class="input-field"></div>
    <button id="loginSubmitBtn" class="btn btn-primary btn-full">Login</button>
    <div style="text-align:center; margin:16px;"><span>or</span></div>
    <button id="googleLoginBtn" class="btn btn-outline btn-full"><i class="fa-brands fa-google"></i> Continue with Google</button>
    <div style="text-align:center; margin-top:16px;"><a href="signup.html">Sign up →</a> &nbsp;|&nbsp; <a href="index.html">Back</a></div>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
  let supabaseClient = null;
  const interval = setInterval(() => {
    if (window.sb) { clearInterval(interval); supabaseClient = window.sb; enableButtons(); }
  }, 200);
  function enableButtons() {
    const loginBtn = document.getElementById('loginSubmitBtn');
    const googleBtn = document.getElementById('googleLoginBtn');
    loginBtn.onclick = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { alert('Please enter email and password'); return; }
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        if (error.message.includes('Invalid login credentials')) alert('Invalid email or password');
        else alert(error.message);
      } else {
        // Welcome popup will be shown by shared.js on auth state change
        window.location.href = 'plan.html';
      }
    };
    googleBtn.onclick = async () => {
      googleBtn.disabled = true;
      googleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/plan.html' } });
      if (error) { alert(error.message); googleBtn.disabled = false; googleBtn.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google'; }
    };
  }
</script>
</body>
</html>
