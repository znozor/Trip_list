<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="vercel:toolbar" content="disable">
  <title>Weather Trip – Pack Smarter, Travel Happier</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Simple modern card – exactly like profile.html’s card */
    .welcome-card {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .welcome-header {
      margin-bottom: 32px;
    }

    .hero-icon {
      font-size: 64px;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .auth-buttons {
      margin: 32px 0 20px;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 14px 20px;
      width: 100%;
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-google i {
      font-size: 20px;
      color: #4285F4;
    }

    .btn-google:hover {
      background: var(--border-light);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .guest-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }

    .guest-link:hover {
      text-decoration: underline;
    }

    .disclaimer {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* Same as profile.html background */
    body {
      background: var(--bg);
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="welcome-card">
    <div class="welcome-header">
      <div class="hero-icon">
        <i class="fa-solid fa-cloud-sun"></i>
      </div>
      <div class="hero-title">Weather Trip</div>
      <div class="hero-subtitle">Pack Smarter, Travel Happier</div>
    </div>

    <div class="auth-buttons">
      <button class="btn-google" id="googleBtn">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
    </div>

    <a href="plan.html" class="guest-link">Continue as guest →</a>

    <div class="disclaimer">
      🌦️ Weather predictions are estimates. Use common sense when packing.
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>

<script>
  const googleBtn = document.getElementById('googleBtn');

  googleBtn.disabled = true;
  googleBtn.style.opacity = '0.6';

  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    if (typeof window.signInWithGoogle === 'function') {
      clearInterval(interval);
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.onclick = async () => {
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
        await window.signInWithGoogle();
        setTimeout(() => {
          if (googleBtn) {
            googleBtn.disabled = false;
            googleBtn.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google';
          }
        }, 5000);
      };
    } else if (attempts > 25) {
      clearInterval(interval);
      console.warn('signInWithGoogle not available');
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.innerText = 'Sign in (reload if stuck)';
    }
  }, 200);
</script>
</body>
</html>
