<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>WanderPack – Welcome</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
<div class="app-wrapper">
  <div class="welcome-hero">
    <span class="hero-illustration">🧳✈️</span>
    <div class="hero-title">WanderPack</div>
    <div class="hero-subtitle">Pack Smarter, Travel Happier</div>
  </div>
  <div class="welcome-body">
    <div class="auth-buttons">
      <button class="btn btn-outline" id="googleBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>
      <button class="btn btn-primary" id="signupRedirectBtn"><i class="fa-solid fa-envelope"></i> Sign Up with Email</button>
    </div>
    <div style="text-align: center; margin: 16px 0;">
      <span>Already have an account? <a href="login.html" class="guest-link">Login →</a></span>
    </div>
    <a href="plan.html" class="guest-link">Continue as guest →</a>
    <div class="disclaimer">Weather predictions are estimates. Use common sense when packing.</div>
    <div id="debugArea" style="background: #ffe0e0; border-radius: 12px; padding: 8px; margin-top: 12px; font-size: 12px; display: none;">
  <strong>Debug:</strong> <span id="debugMsg">No message</span>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<<script>
  const debugDiv = document.getElementById('debugArea');
  const debugMsg = document.getElementById('debugMsg');
  function showDebug(msg) {
    debugDiv.style.display = 'block';
    debugMsg.innerText = msg;
    setTimeout(() => { debugDiv.style.display = 'none'; }, 8000);
  }

  // Check config.js
  if (typeof CONFIG === 'undefined') showDebug('ERROR: config.js not loaded');
  else if (!CONFIG.SUPABASE_URL) showDebug('ERROR: CONFIG.SUPABASE_URL missing');
  else showDebug('Config OK');

  // Check window.supabase
  setTimeout(() => {
    if (!window.supabase) showDebug('ERROR: Supabase not initialized');
    else showDebug('Supabase OK');
  }, 500);

  // Google button
  const googleBtn = document.getElementById('googleBtn');
  if (!googleBtn) showDebug('ERROR: Google button not found');
  else {
    googleBtn.onclick = () => {
      showDebug('Google button clicked!');
      if (typeof signInWithGoogle === 'function') {
        showDebug('Calling signInWithGoogle...');
        signInWithGoogle();
      } else {
        showDebug('ERROR: signInWithGoogle is not a function');
      }
    };
  }

  // Other buttons (signup, etc.)
  const signupBtn = document.getElementById('emailSignupBtn');
  const showLoginLink = document.getElementById('showLoginLink');
  const emailForm = document.getElementById('emailLoginForm');
  signupBtn.onclick = () => {
    const email = prompt('Enter email:');
    if (!email) return;
    const password = prompt('Enter password (min 6 chars):');
    if (!password) return;
    const fullName = prompt('Your full name:');
    signUpWithEmail(email, password, fullName);
  };
  showLoginLink.onclick = (e) => {
    e.preventDefault();
    emailForm.style.display = emailForm.style.display === 'none' ? 'block' : 'none';
  };
  document.getElementById('doLoginBtn').onclick = () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if (email && password) signInWithEmail(email, password);
    else showToast('Enter email and password', 'warning');
  };
  initAuth();
</script>
</body>
</html>
