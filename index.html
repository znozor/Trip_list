<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="vercel:toolbar" content="disable">
  <title>WanderPack – Welcome</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
<div class="app-wrapper">
  <div class="welcome-hero">
    <span class="hero-illustration">🧳✈️</span>
    <div class="hero-title">WanderPack</div>
    <div class="hero-subtitle">Pack Smarter, Travel Happier</div>
  </div>
  <div class="welcome-body">
    <div class="auth-buttons">
      <button class="btn btn-outline" id="googleBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>
      <button class="btn btn-primary" id="signupRedirectBtn"><i class="fa-solid fa-envelope"></i> Sign Up with Email</button>
    </div>
    <div style="text-align: center; margin: 16px 0;">
      <span>Already have an account? <a href="login.html" class="guest-link">Login →</a></span>
    </div>
    <a href="plan.html" class="guest-link">Continue as guest →</a>
    <div id="debugArea" style="background: #ffe0e0; border-radius: 12px; padding: 8px; margin-top: 12px; font-size: 12px; display: none;">
      <strong>Debug:</strong> <span id="debugMsg">No message</span>
    </div>
    <div class="disclaimer">Weather predictions are estimates. Use common sense when packing.</div>
  </div>
</div>
<script>
  // ------ Debug helper ------
  const debugDiv = document.getElementById('debugArea');
  const debugSpan = document.getElementById('debugMsg');
  function debug(msg, isError = false) {
    if (debugDiv && debugSpan) {
      debugSpan.innerText = msg;
      debugDiv.style.display = 'block';
      debugDiv.style.background = isError ? '#ffcccc' : '#ffe0e0';
      setTimeout(() => { debugDiv.style.display = 'none'; }, 6000);
    }
    console.log(msg);
  }

  // ------ Init Supabase ------
  let supabase = null;
  if (typeof CONFIG === 'undefined') {
    debug('ERROR: config.js not loaded', true);
  } else if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
    debug('ERROR: SUPABASE_URL or ANON_KEY missing', true);
  } else if (typeof window.supabase === 'undefined') {
    debug('ERROR: Supabase CDN not loaded', true);
  } else {
    try {
      supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      debug('Supabase ready');
    } catch(e) {
      debug('Supabase init error: ' + e.message, true);
    }
  }

  // ------ Google Sign-In ------
  window.signInWithGoogle = async function() {
    debug('Google button clicked');
    if (!supabase) {
      debug('Supabase not ready – cannot login', true);
      alert('Supabase not ready. Please refresh the page.');
      return;
    }
    try {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/plan.html' }
      });
      if (error) {
        debug('Google error: ' + error.message, true);
        alert('Google login error: ' + error.message);
      } else {
        debug('Redirecting to Google...');
      }
    } catch(err) {
      debug('Unexpected error: ' + err.message, true);
      alert('Error: ' + err.message);
    }
  };

  // ------ Enable Google button after Supabase is ready ------
  const googleBtn = document.getElementById('googleBtn');
  if (googleBtn) {
    googleBtn.disabled = true;
    googleBtn.style.opacity = '0.6';

    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      if (supabase) {
        clearInterval(interval);
        googleBtn.disabled = false;
        googleBtn.style.opacity = '1';
        googleBtn.onclick = () => window.signInWithGoogle();
        debug('Google button enabled');
      } else if (attempts > 20) {
        clearInterval(interval);
        debug('Timeout – Supabase never ready', true);
      }
    }, 250);
  } else {
    debug('Google button not found', true);
  }

  // ------ Email signup redirect ------
  const signupBtn = document.getElementById('signupRedirectBtn');
  if (signupBtn) {
    signupBtn.onclick = () => { window.location.href = 'signup.html'; };
  }
</script>
</body>
</html>
