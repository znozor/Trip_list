<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="vercel:toolbar" content="disable">
  <title>WeatherTrip – Pack Smarter, Travel Happier</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Full background image */
    body {
      background: url('assets/welcome-bg.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    /* Centering container */
    .app-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      backdrop-filter: brightness(0.98); /* soft overlay to keep card readable */
    }

    /* Clean card – exactly like the image */
    .welcome-card {
      max-width: 420px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 40px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }

    /* Big centered icon */
    .hero-illustration {
      font-size: 80px;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* Gradient title – same as image */
    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(135deg, #06A77D, #0B8B6E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    /* Subtitle style */
    .hero-subtitle {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      font-weight: 500;
    }

    /* Google button – matching the image (border, rounded, clean) */
    .btn-google {
      background: white;
      border: 1px solid #d4dde0;
      border-radius: 60px;
      padding: 14px 20px;
      width: 100%;
      font-weight: 600;
      font-size: 16px;
      color: #1F2E33;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-google i {
      font-size: 20px;
      color: #4285F4;
    }

    .btn-google:hover {
      background: #f5f9fc;
      border-color: #b8c9cf;
      transform: scale(0.98);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Guest link */
    .guest-link {
      display: block;
      margin-top: 24px;
      color: #1e8b6e;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    .guest-link:hover {
      text-decoration: underline;
    }

    /* Disclaimer */
    .disclaimer {
      font-size: 12px;
      color: #7F9BA3;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #e2edf0;
      line-height: 1.4;
    }

    /* Dark mode support (optional but keeps consistency) */
    @media (prefers-color-scheme: dark) {
      .welcome-card {
        background: rgba(30, 35, 38, 0.92);
        backdrop-filter: blur(2px);
      }
      .btn-google {
        background: #1e2a2c;
        border-color: #3a4e54;
        color: #eef2f0;
      }
      .btn-google:hover {
        background: #2a3c40;
      }
      .disclaimer {
        border-top-color: #2e4a50;
        color: #9bb7be;
      }
    }
  </style>
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
<div class="app-wrapper">
  <div class="welcome-card">
    <div class="hero-illustration">🧳✈️</div>
    <div class="hero-title">WeatherTrip</div>
    <div class="hero-subtitle">Pack Smarter, Travel Happier</div>

    <button class="btn-google" id="googleBtn">
      <i class="fa-brands fa-google"></i> Continue with Google
    </button>

    <a href="plan.html" class="guest-link">Continue as guest →</a>

    <div class="disclaimer">
      🌦️ Weather predictions are estimates.<br>Use common sense when packing.
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>

<script>
  const googleBtn = document.getElementById('googleBtn');
  googleBtn.disabled = true;
  googleBtn.style.opacity = '0.6';

  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    if (typeof window.signInWithGoogle === 'function') {
      clearInterval(interval);
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.onclick = async () => {
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
        await window.signInWithGoogle();
        setTimeout(() => {
          if (googleBtn) {
            googleBtn.disabled = false;
            googleBtn.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google';
          }
        }, 5000);
      };
    } else if (attempts > 25) {
      clearInterval(interval);
      console.warn('signInWithGoogle not available');
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.innerText = 'Sign in (reload if stuck)';
    }
  }, 200);
</script>
</body>
</html>
