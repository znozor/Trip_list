<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="vercel:toolbar" content="disable">

  <title>WeatherTrip – Pack Smarter, Travel Happier</title>

  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      font-family:'DM Sans',sans-serif;
      overflow:hidden;
    }

    body{
      background:#059669;
    }

    .app-wrapper{
      position:relative;
      width:100%;
      min-height:100vh;

      /* YOUR IMAGE */
      background:
        linear-gradient(rgba(0,0,0,0.12),rgba(0,0,0,0.18)),
        url('./assets/welcome-bg.png');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* TOP CONTENT */
    .hero-content{
      margin-top:58vh;
      width:100%;
      text-align:center;
      padding:0 28px;
    }

    .hero-title{
      font-family:'Syne',sans-serif;
      font-size:58px;
      font-weight:800;
      color:white;
      letter-spacing:-2px;
      line-height:1;
      text-shadow:0 6px 20px rgba(0,0,0,0.2);
    }

    .hero-subtitle{
      margin-top:16px;
      color:rgba(255,255,255,0.92);
      font-size:22px;
      font-weight:500;
    }

    /* BUTTON AREA */
    .auth-area{
      width:100%;
      padding:34px 28px 26px;
      margin-top:auto;
    }

    .btn-google{
      width:100%;
      height:68px;

      border:none;
      border-radius:999px;

      background:white;
      color:#0b5d45;

      font-size:20px;
      font-weight:700;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.8);

      cursor:pointer;

      transition:0.2s ease;
    }

    .btn-google:active{
      transform:scale(0.98);
    }

    .btn-google i{
      font-size:24px;
    }

    .btn-google:disabled{
      opacity:0.7;
      cursor:not-allowed;
    }

    .guest-link{
      width:100%;
      height:68px;

      margin-top:18px;

      border-radius:999px;
      border:2px solid rgba(255,255,255,0.85);

      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;

      color:white;
      text-decoration:none;

      font-size:20px;
      font-weight:600;

      background:rgba(255,255,255,0.03);
      backdrop-filter:blur(4px);
    }

    .guest-link i{
      font-size:22px;
    }

    /* DISCLAIMER CARD */
    .disclaimer{
      margin-top:26px;

      width:100%;

      background:rgba(255,255,255,0.08);

      border-radius:28px;

      padding:18px 20px;

      display:flex;
      align-items:center;
      gap:16px;

      backdrop-filter:blur(10px);

      color:white;
    }

    .disclaimer-icon{
      font-size:34px;
      flex-shrink:0;
    }

    .disclaimer-text{
      font-size:16px;
      line-height:1.5;
      color:rgba(255,255,255,0.92);
    }

    /* MOBILE */
    @media (max-width:480px){

      .hero-content{
        margin-top:56vh;
      }

      .hero-title{
        font-size:52px;
      }

      .hero-subtitle{
        font-size:20px;
      }

      .btn-google,
      .guest-link{
        height:64px;
        font-size:18px;
      }
    }
  </style>

  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>

<div class="app-wrapper">

  <div class="hero-content">
    <div class="hero-title">Weathist</div>

    <div class="hero-subtitle">
      Pack Smarter, Travel Happier
    </div>
  </div>

  <div class="auth-area">

    <button class="btn-google" id="googleBtn">
      <i class="fa-brands fa-google"></i>
      Continue with Google
    </button>

    <a href="plan.html" class="guest-link">
      <i class="fa-regular fa-user"></i>
      Continue as guest →
    </a>

    <div class="disclaimer">
      <div class="disclaimer-icon">🌦️</div>

      <div class="disclaimer-text">
        Weather predictions are estimates.<br>
        Use common sense when packing.
      </div>
    </div>

  </div>

</div>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="shared.js"></script>

<script>
  const googleBtn = document.getElementById('googleBtn');

  googleBtn.disabled = true;
  googleBtn.style.opacity = '0.7';

  let attempts = 0;

  const interval = setInterval(() => {

    attempts++;

    if (typeof window.signInWithGoogle === 'function') {

      clearInterval(interval);

      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';

      googleBtn.onclick = async () => {

        googleBtn.disabled = true;

        googleBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

        await window.signInWithGoogle();

        setTimeout(() => {

          if (googleBtn) {

            googleBtn.disabled = false;

            googleBtn.innerHTML =
              '<i class="fa-brands fa-google"></i> Continue with Google';

          }

        }, 5000);

      };

    } else if (attempts > 25) {

      clearInterval(interval);

      console.warn('signInWithGoogle not available');

      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';

      googleBtn.innerText = 'Sign in (reload if stuck)';
    }

  }, 200);
</script>

</body>
</html>
