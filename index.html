<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="vercel:toolbar" content="disable">
  <title>WeatherTrip – Pack Smarter, Travel Happier</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: #059669;
    }

    /* FULLSCREEN BACKGROUND */
    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.16)),
                  url('./assets/welcome-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* REMOVE OLD CARD EFFECT */
    .welcome-card {
      width: 100%;
      height: 100vh;
      max-width: none;
      padding: 0 24px;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HIDE EMOJI */
    .hero-illustration {
      display: none;
    }

    /* TITLE - fixed overflow */
    .hero-title {
      margin-top: 42vh;
      font-family: 'Syne', sans-serif;
      font-size: clamp(48px, 12vw, 72px);
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
      text-shadow: 0 6px 18px rgba(0,0,0,0.18);
      text-align: center;
      line-height: 1.1;
      word-break: keep-all;
    }

    /* SUBTITLE */
    .hero-subtitle {
      margin-top: 14px;
      color: rgba(255,255,255,0.95);
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 500;
      text-align: center;
      padding: 0 12px;
    }

    /* GOOGLE BUTTON — exactly like image 2 */
    .btn-google {
      margin-top: 56px;
      width: 100%;
      max-width: 380px;
      height: 68px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #0b5d45;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .btn-google i {
      font-size: 22px;
    }

    .btn-google:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* GUEST BUTTON */
    .guest-link {
      margin-top: 18px;
      width: 100%;
      max-width: 380px;
      height: 68px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .guest-link i {
      font-size: 20px;
    }

    /* DISCLAIMER */
    .disclaimer {
      margin-top: 32px;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 18px 20px;
      backdrop-filter: blur(10px);
      color: white;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    /* Mobile fine-tuning */
    @media (max-width: 480px) {
      .welcome-card {
        padding: 0 20px;
      }
      .hero-title {
        margin-top: 38vh;
      }
      .btn-google, .guest-link {
        height: 60px;
        font-size: 16px;
        max-width: 100%;
      }
      .btn-google i {
        font-size: 20px;
      }
      .guest-link i {
        font-size: 18px;
      }
      .disclaimer {
        font-size: 13px;
        padding: 14px 16px;
        margin-top: 24px;
      }
    }

    /* For very tall screens */
    @media (min-height: 800px) {
      .hero-title {
        margin-top: 45vh;
      }
    }
  </style>
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
<div class="app-wrapper">
  <div class="welcome-card">
    <div class="hero-illustration">🧳✈️</div>
    <div class="hero-title">WeatherTrip</div>
    <div class="hero-subtitle">Pack Smarter, Travel Happier</div>

    <button class="btn-google" id="googleBtn">
      <i class="fa-brands fa-google"></i>
      Continue with Google
    </button>

    <a href="plan.html" class="guest-link">
      <i class="fa-regular fa-user"></i>
      Continue as guest →
    </a>

    <div class="disclaimer">
      🌦️ Weather predictions are estimates.<br>
      Use common sense when packing.
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>

<script>
  const googleBtn = document.getElementById('googleBtn');
  googleBtn.disabled = true;
  googleBtn.style.opacity = '0.7';

  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    if (typeof window.signInWithGoogle === 'function') {
      clearInterval(interval);
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.onclick = async () => {
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
        await window.signInWithGoogle();
        setTimeout(() => {
          if (googleBtn) {
            googleBtn.disabled = false;
            googleBtn.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google';
          }
        }, 5000);
      };
    } else if (attempts > 25) {
      clearInterval(interval);
      console.warn('signInWithGoogle not available');
      googleBtn.disabled = false;
      googleBtn.style.opacity = '1';
      googleBtn.innerText = 'Sign in (reload if stuck)';
    }
  }, 200);
</script>
</body>
</html>
