<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Profile – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item active" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>

  <div class="card" style="text-align: center;">
    <div class="avatar-circle" id="avatar">👤</div>
    <h3 id="userName">Guest</h3>
    <p id="userEmail"></p>
    <button id="logoutBtn" class="btn btn-outline btn-full" style="margin-top: 8px;">Logout</button>
  </div>

  <div class="card">
    <div class="settings-row">
      <span><i class="fa-solid fa-moon"></i> Dark Mode</span>
      <label class="toggle-switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-outline btn-full" id="exportBtn"><i class="fa-solid fa-download"></i> Export All Data (JSON)</button>
    <button class="btn btn-danger btn-full" id="deleteAccountBtn" style="margin-top: 12px;"><i class="fa-solid fa-trash"></i> Delete All Local Data</button>
  </div>

  <div class="disclaimer">WanderPack v1.0 – Data is stored locally unless you log in.</div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="profile.js"></script>
</body>
</html>
