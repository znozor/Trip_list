<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Sign Up – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
<div class="app-wrapper">
  <div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; margin-bottom: 24px;"><i class="fa-solid fa-user-plus"></i> Create Account</h2>
    <div class="input-group">
      <label class="input-label">Full Name</label>
      <input type="text" id="signupName" class="input-field" placeholder="John Doe">
    </div>
    <div class="input-group">
      <label class="input-label">Email</label>
      <input type="email" id="signupEmail" class="input-field" placeholder="you@example.com">
    </div>
    <div class="input-group">
      <label class="input-label">Password (min 6 characters)</label>
      <input type="password" id="signupPassword" class="input-field" placeholder="••••••">
    </div>
    <button id="signupSubmitBtn" class="btn btn-primary btn-full">Sign Up</button>
    <div style="text-align: center; margin-top: 16px;">
      Already have an account? <a href="login.html" class="guest-link">Login →</a>
    </div>
    <div style="text-align: center; margin-top: 16px;">
      <a href="index.html" class="guest-link">← Back</a>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  document.getElementById('signupSubmitBtn').onclick = async () => {
    const fullName = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!fullName || !email || !password) {
      showToast('Please fill all fields', 'warning');
      return;
    }
    if (password.length < 6) {
      showToast('Password must be at least 6 characters', 'warning');
      return;
    }
    await signUpWithEmail(email, password, fullName);
    // Show success and redirect to login after delay
    showToast('Account created! Please check your email to confirm.', 'success');
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);
  };
</script>
</body>
</html>
