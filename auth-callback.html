<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WanderPack – Logging in...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #F0F7F4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
    }
    .container {
      text-align: center;
      background: white;
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #06A77D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #2C3E50;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <p>Completing login, please wait...</p>
</div>
<script>
  // Force viewport again (extra safety)
  document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
  // Redirect to plan.html (normal navigation)
  setTimeout(() => {
    window.location.href = 'plan.html';
  }, 50);
</script>
</body>
</html>
