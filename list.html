<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Packing List – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app-wrapper">
  <div class="list-header">
    <div><h2><i class="fa-solid fa-list-check"></i> Your Packing List</h2></div>
    <div class="list-trip-badge" id="tripBadge"></div>
    <div id="listProgress">0 / 0 items packed</div>
  </div>
  <div id="phase2Banner" class="phase2-banner" style="display:none;"><div>🌦️ Trip soon – <a href="#" onclick="showForecastDiff()">update with real forecast</a></div></div>
  <div id="packingListBody"></div>
  <div class="list-actions">
    <button class="btn btn-ghost" onclick="addCustomItem()"><i class="fa-solid fa-plus"></i> Custom Item</button>
    <button class="btn btn-primary" onclick="saveCurrentTrip()"><i class="fa-solid fa-heart"></i> Save Trip</button>
    <button class="btn btn-ghost" onclick="alert('PDF export demo')"><i class="fa-solid fa-download"></i> Export PDF</button>
  </div>
  <div class="disclaimer">As an Amazon Associate we earn from qualifying purchases.</div>
</div>
<div id="diffModal" class="modal" style="display:none;"><div class="modal-content"><span class="close" onclick="closeDiffModal()">&times;</span><h3>Update with Forecast</h3><div id="diffItems"></div><button class="btn btn-primary" onclick="applyForecastChanges()">Apply Changes</button></div></div>
<script src="shared.js"></script>
<script src="list.js"></script>
</body>
</html>
