<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Packing List – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item active" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>

  <div class="list-header">
    <h2><i class="fa-solid fa-list-check"></i> Your Packing List</h2>
    <div id="tripBadge" class="list-trip-badge" style="margin: 12px 0;"></div>
    <div id="listProgress">0 / 0 items packed</div>
  </div>
  <div id="packingListBody"></div>
  <div class="list-actions" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;">
    <button class="btn btn-ghost" id="addCustomItemBtn"><i class="fa-solid fa-plus"></i> Custom Item</button>
    <button class="btn btn-primary" id="saveTripBtn"><i class="fa-solid fa-heart"></i> Save Trip</button>
  </div>
  <div class="disclaimer">As an Amazon Associate we earn from qualifying purchases.</div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
</body>
</html>
