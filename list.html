<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Packing List – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap" rel="stylesheet">
  <script>
  (function() {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  })();
</script>
</head>
<body>
<div class="app-wrapper">
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item active" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>
  <div class="list-header">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
        <button id="backButton" class="btn btn-ghost btn-sm" style="display: none;"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <h2><i class="fa-solid fa-list-check"></i> Your Packing List</h2>
    </div>
    <div id="tripBadge" class="list-trip-badge"></div>
    <div id="weatherConfidence"></div>
    <div id="listProgress"></div>
</div>
  <div id="packingListBody"></div>
  <div class="list-actions" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;">
    <button class="btn btn-ghost" id="addCustomItemBtn">+ Custom Item</button>
    <button class="btn btn-primary" id="saveTripBtn">💾 Save Trip</button>
  </div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
</body>
</html>
