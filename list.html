<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Packing List – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item active" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>

  <div class="list-header">
    <h2><i class="fa-solid fa-list-check"></i> Your Packing List</h2>
    <div id="tripBadge" class="list-trip-badge"></div>
    <div id="listProgress">0 / 0 items</div>
  </div>
  <div id="packingListBody"></div>
  <div class="list-actions" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;">
    <button class="btn btn-ghost" onclick="addCustomItem()">+ Custom Item</button>
    <button class="btn btn-primary" id="saveTripBtn">💾 Save Trip</button>
  </div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
</body>
</html>
