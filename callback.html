<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Signing you in…</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: #F0F7F4;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #dde9e4;
      border-top-color: #06A77D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // Supabase auto-processes the #access_token hash on load
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    _supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        // Clean redirect — no hash, no OAuth params, fresh navigation
        window.location.replace('plan.html');
      }
    });

    // Fallback: if already signed in
    _supabase.auth.getSession().then(({ data }) => {
      if (data.session) {
        window.location.replace('plan.html');
      }
    });

    // Safety timeout — if something goes wrong, go to index
    setTimeout(() => {
      window.location.replace('index.html');
    }, 8000);
  </script>
</body>
</html>
