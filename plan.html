<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Trip – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <!-- Bottom Nav (responsive) -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>

  <div class="form-header">
    <h2><i class="fa-solid fa-suitcase-rolling"></i> Plan Your Trip</h2>
    <div class="step-indicator" id="stepIndicator">
      <div class="step-dot active" id="dot-0">1</div><div class="step-line" id="line-0"></div>
      <div class="step-dot" id="dot-1">2</div><div class="step-line" id="line-1"></div>
      <div class="step-dot" id="dot-2">3</div><div class="step-line" id="line-2"></div>
      <div class="step-dot" id="dot-3">4</div>
    </div>
  </div>

  <div class="form-body">
    <!-- Step 1: Destinations -->
    <div class="form-step active" id="step-0"><div class="card"><div class="section-header"><h2>Where are you going?</h2></div><div class="input-group"><label>Country</label><select id="countrySelect" class="input-field"><option>Japan</option><option>France</option><option>Italy</option><option>Thailand</option></select></div><div id="cityFields"><div class="city-row"><input type="text" id="city-0" class="input-field" placeholder="City" value="Tokyo"></div></div><button class="btn-ghost btn-sm" onclick="addCity()"><i class="fa-solid fa-plus"></i> Add city</button><div class="toggle-row"><span>Multi-country</span><label class="toggle-switch"><input type="checkbox" id="multiCountryToggle"><span class="toggle-slider"></span></label></div><div id="extraCountries" style="display:none;">...</div></div></div>
    <!-- Step 2: Dates -->
    <div class="form-step" id="step-1"><div class="card"><h2>Dates</h2><input type="date" id="startDate" class="input-field"><input type="date" id="endDate" class="input-field" style="margin-top:10px;"><div id="multiDates" style="display:none;">...</div></div></div>
    <!-- Step 3: Style -->
    <div class="form-step" id="step-2"><div class="card"><h2>Trip style</h2><div class="chips-group" id="chips-reason"><div class="chip selected" data-val="Leisure">Leisure</div><div class="chip" data-val="Adventure">Adventure</div></div><div class="chips-group" id="chips-style"><div class="chip selected" data-val="Standard">Standard</div></div><div class="chips-group" id="chips-activities"><div class="chip selected" data-val="Hiking">Hiking</div><div class="chip" data-val="City Tours">City Tours</div></div></div></div>
    <!-- Step 4: Weather -->
    <div class="form-step" id="step-3"><div class="card"><h2>Weather preview</h2><div id="weatherPreview">Loading...</div><label class="toggle-switch"><input type="checkbox" id="timeTravelToggle"> Simulate close trip</label></div></div>
  </div>

  <div class="form-nav"><button class="btn btn-outline" id="prevBtn" style="display:none">Back</button><button class="btn btn-primary" id="nextBtn">Next</button></div>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="plan.js"></script>
</body>
</html>
