<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Plan Trip – WanderPack</title>

  <link rel="stylesheet" href="shared.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Syne&family=DM+Sans&display=swap"
        rel="stylesheet">

  <script>
    // DARK MODE
    (function () {
      const theme = localStorage.getItem('theme');

      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    // MOBILE VIEW FIX AFTER GOOGLE LOGIN
    function fixMobileView() {

      // Force viewport again
      let meta = document.querySelector('meta[name="viewport"]');

      if (!meta) {
        meta = document.createElement('meta');
        meta.name = 'viewport';
        document.head.appendChild(meta);
      }

      meta.setAttribute(
        'content',
        'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
      );

      // Reset zoom/scaling
      document.documentElement.style.zoom = '1';
      document.body.style.zoom = '1';

      document.documentElement.style.width = '100%';
      document.body.style.width = '100%';

      document.documentElement.style.overflowX = 'hidden';
      document.body.style.overflowX = 'hidden';

      // Fix Chrome Android weird scale after OAuth
      if (window.visualViewport) {
        document.body.style.transform = 'scale(1)';
        document.body.style.transformOrigin = 'top left';
      }

      // Force repaint
      document.body.style.display = 'none';
      document.body.offsetHeight;
      document.body.style.display = '';
    }

    window.addEventListener('load', () => {
      fixMobileView();

      setTimeout(fixMobileView, 100);
      setTimeout(fixMobileView, 500);
      setTimeout(fixMobileView, 1000);
    });
  </script>
</head>

<body>

<div class="app-wrapper">

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="location.href='plan.html'">
      <i class="fa-solid fa-map"></i>
      <span>Trip</span>
    </div>

    <div class="nav-item" onclick="location.href='list.html'">
      <i class="fa-solid fa-list-check"></i>
      <span>List</span>
    </div>

    <div class="nav-item" onclick="location.href='trips.html'">
      <i class="fa-solid fa-folder-open"></i>
      <span>Trips</span>
    </div>

    <div class="nav-item" onclick="location.href='profile.html'">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </div>
  </nav>

  <!-- Header -->
  <div class="form-header">
    <h2>
      <i class="fa-solid fa-suitcase-rolling"></i>
      Plan Your Trip
    </h2>

    <div class="step-indicator" id="stepIndicator">
      <div class="step-dot active" id="dot-0">1</div>
      <div class="step-line" id="line-0"></div>

      <div class="step-dot" id="dot-1">2</div>
      <div class="step-line" id="line-1"></div>

      <div class="step-dot" id="dot-2">3</div>
      <div class="step-line" id="line-2"></div>

      <div class="step-dot" id="dot-3">4</div>
    </div>
  </div>

  <!-- Form Body -->
  <div class="form-body">

    <!-- STEP 1 -->
    <div class="form-step active" id="step-0">
      <div class="card">

        <div class="section-header">
          <h2>
            <i class="fa-solid fa-map-location-dot"></i>
            Where are you going?
          </h2>
        </div>

        <div class="input-group">
          <label class="input-label">Country</label>

          <input
            type="text"
            id="countryInput"
            list="countryList"
            class="input-field"
            placeholder="Type or select country"
            autocomplete="off">

          <datalist id="countryList">
            <option>Japan</option>
            <option>France</option>
            <option>Italy</option>
            <option>Thailand</option>
            <option>USA</option>
            <option>Spain</option>
            <option>UK</option>
          </datalist>
        </div>

        <div id="cityFields">
          <div class="city-row">

            <label class="input-label">City</label>

            <input
              type="text"
              id="cityInput0"
              list="cityList0"
              class="input-field"
              placeholder="Type or select city"
              autocomplete="off">

            <datalist id="cityList0"></datalist>

          </div>
        </div>

        <button class="btn btn-ghost btn-sm"
                type="button"
                onclick="addCityField()">

          <i class="fa-solid fa-plus"></i>
          Add another city
        </button>

        <p class="city-hint"
           style="font-size:12px; margin-top:12px; color:var(--text-secondary);">

          <i class="fa-regular fa-lightbulb"></i>
          We'll show weather for all cities and combine recommendations.
        </p>

      </div>
    </div>

  </div>

  <!-- Buttons -->
  <div class="form-nav"
       style="display:flex; gap:12px; margin-top:20px;">

    <button class="btn btn-outline"
            id="prevBtn"
            style="display:none">

      <i class="fa-solid fa-arrow-left"></i>
      Back
    </button>

    <button class="btn btn-primary"
            id="nextBtn"
            style="margin-left:auto">

      Next →
    </button>

  </div>

</div>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="shared.js"></script>

<script src="plan.js"></script>

</body>
</html>
