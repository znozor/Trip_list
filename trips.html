<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
  (function() {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  })();
</script>
</head>
<body>
<div class="app-wrapper">
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='plan.html'"><i class="fa-solid fa-map"></i><span>Trip</span></div>
    <div class="nav-item" onclick="window.location.href='list.html'"><i class="fa-solid fa-list-check"></i><span>List</span></div>
    <div class="nav-item active" onclick="window.location.href='trips.html'"><i class="fa-solid fa-folder-open"></i><span>Trips</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </nav>
  <div class="trips-header" style="display: flex; justify-content: space-between; margin-bottom: 24px;">
    <h2><i class="fa-solid fa-folder-open"></i> My Saved Trips</h2>
    <a href="plan.html" class="btn btn-primary btn-sm">+ New Trip</a>
  </div>
  <div id="tripsList" class="trips-grid"></div>
</div>
<!-- Modal (required for future use, hidden) -->
<div id="tripModal" style="display:none;"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script src="trips.js"></script>
</body>
</html>
