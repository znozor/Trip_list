<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Trips – WanderPack</title>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app-wrapper">
  <div class="trips-header"><h2><i class="fa-solid fa-folder-open"></i> My Saved Trips</h2><a href="plan.html" class="btn btn-primary btn-sm">New Trip</a></div>
  <div id="tripsList" class="trips-grid"></div>
</div>
<script src="shared.js"></script>
<script>
  function renderTrips() {
    const trips = getTrips();
    const container = document.getElementById('tripsList');
    if (!trips.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><p>No trips saved yet. Generate your first packing list!</p></div>'; return; }
    container.innerHTML = trips.map(t => `<div class="trip-card"><div><strong>${t.city}, ${t.country}</strong><br><small>${t.startDate} – ${t.endDate}</small></div><div class="trip-actions"><button class="btn btn-sm" onclick="viewTrip('${t.id}')">View</button><button class="btn btn-sm btn-outline" onclick="deleteTrip('${t.id}')">Delete</button></div></div>`).join('');
  }
  function viewTrip(id) { showToast('View trip demo – would load list', 'info'); }
  function deleteTrip(id) { const trips = getTrips().filter(t => t.id != id); saveTrips(trips); renderTrips(); showToast('Trip deleted'); }
  renderTrips();
</script>
</body>
</html>
